<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Return</title>
  <script>
    if (window.self !== window.top) {
      window.top.location.href = window.self.location.href;
    }
  </script>
</head>
<body>
  <div>
    Payment processed. It is your responsibility to build a result or a
    confirm (for authorize flow) page. commercetools Checkout redirected you to:
  </div>
  <p><a id="return-url" href="#"></a></p>
  <p><a href="__BACK_TO_STORYBOOK__" target="_top">&larr; Back to Storybook</a></p>
  <script>
    var returnUrlLink = document.getElementById("return-url");
    returnUrlLink.href = window.location.href;
    returnUrlLink.textContent = window.location.href;
  </script>
</body>
</html>
